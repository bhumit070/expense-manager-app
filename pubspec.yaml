name: expense_manager
description: "Offline-first expense, investment and debt tracker."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  geocoding: ^5.0.0
  geolocator: ^14.0.1
  latlong2: ^0.10.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1
  sqlite3: ^3.5.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  share_plus_platform_interface: ^7.2.0
  file_picker_platform_interface: ^4.2.0
  geolocator_platform_interface: ^4.4.1
  geocoding_platform_interface: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800

# App icon designed in Penpot (boards "App icon · …"), exported to assets/icon/.
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon_full.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: assets/icon/icon_bg.png
  adaptive_icon_foreground: assets/icon/icon_fg.png
  adaptive_icon_monochrome: assets/icon/icon_fg.png
