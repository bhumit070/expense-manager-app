include: package:flutter_lints/flutter.yaml

# Same width as tool/verify.sh, so generated code (gen-l10n) matches the format gate.
formatter:
  page_width: 200

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - coverage/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
    - unnecessary_await_in_return
    - use_build_context_synchronously
