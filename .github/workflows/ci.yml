name: CI

# Pushes to main are verified by release.yml; this checks pull requests
# that change code or build inputs (docs-only PRs are skipped).
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'assets/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed --line-length 200 lib test tool
      - run: flutter analyze
      - run: flutter test --coverage --exclude-tags golden,perf
      - run: dart run tool/check_coverage.dart 100
      - run: flutter build apk --debug --flavor dev

  # Compiles the iOS app (Swift App Intent, plugins) on macOS; no signing.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
